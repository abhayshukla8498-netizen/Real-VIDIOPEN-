name: Build Play Store Release AAB & APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Extract ZIP & Generate Exact Required Keystore
        run: |
          # 1. Extract Zip File
          if [ -f "novaplay.zip" ]; then
            echo "Unzipping novaplay.zip..."
            unzip -o novaplay.zip
          fi

          # 2. Locate Project Directory
          GRADLE_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            TARGET_DIR=$(dirname "$GRADLE_FILE")
            if [ "$(basename "$TARGET_DIR")" = "app" ]; then
              cd "$TARGET_DIR/.."
            else
              cd "$TARGET_DIR"
            fi
          fi

          # 3. Setup settings.gradle.kts
          rm -f settings.gradle settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NovaPlay"
          if (file("app").exists()) {
              include(":app")
          }
          EOF

          # 4. Generate my-upload-key.jks with Password 'Abhay2008'
          mkdir -p keystore_backup
          keytool -genkey -v \
            -keystore keystore_backup/my-upload-key.jks \
            -alias novaplay_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Abhay2008 \
            -keypass Abhay2008 \
            -dname "CN=Abhay, OU=NovaPlay, O=NovaPlay, L=India, ST=India, C=IN"

          # Copy to root and app folder as required by build.gradle.kts
          cp keystore_backup/my-upload-key.jks my-upload-key.jks
          [ -d "app" ] && cp keystore_backup/my-upload-key.jks app/my-upload-key.jks || true

          # 5. Environment Properties
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=dummy_key" > .env

          # 6. Wrapper Setup with Gradle 8.7
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

          # 7. Build Play Store AAB & Release APK
          if [ -d "app" ]; then
            ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36
          else
            ./gradlew bundleRelease assembleRelease --no-daemon -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36
          fi

      - name: Upload Play Store AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-PlayStore-Release-Bundle
          path: |
            **/*.aab
            **/*.apk

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-Keystore-Backup
          path: keystore_backup/my-upload-key.jks
          
