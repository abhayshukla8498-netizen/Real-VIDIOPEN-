name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Extract ZIP File & Generate Keystore
        run: |
          # 1. Unzip novaplay.zip
          if [ -f "novaplay.zip" ]; then
            echo "Unzipping novaplay.zip..."
            unzip -o novaplay.zip
          fi

          # 2. Project location find karo
          GRADLE_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            TARGET_DIR=$(dirname "$GRADLE_FILE")
            if [ "$(basename "$TARGET_DIR")" = "app" ]; then
              cd "$TARGET_DIR/.."
            else
              cd "$TARGET_DIR"
            fi
          fi

          # 3. Create fresh settings.gradle.kts
          rm -f settings.gradle settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NovaPlay"
          if (file("app").exists()) {
              include(":app")
          }
          EOF

          # 4. Generate Debug Keystore file if missing
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # Root directory aur app directory dono me copy kar do
          cp ~/.android/debug.keystore debug.keystore 2>/dev/null || true
          [ -d "app" ] && cp ~/.android/debug.keystore app/debug.keystore 2>/dev/null || true

          # 5. Environment Properties
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=dummy_key" > .env

          # 6. Wrapper & Build APK
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

          if [ -d "app" ]; then
            ./gradlew :app:assembleDebug --no-daemon -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36
          else
            ./gradlew assembleDebug --no-daemon -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-vidiopen-debug-apk
          path: '**/*.apk'
          
