name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Locate Project & Build APK
        run: |
          # Dhoondo ki app/build.gradle.kts kahan par hai
          APP_PATH=$(find . -name "build.gradle.kts" | grep "app/build.gradle.kts" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            # Agar app/build.gradle.kts na mile to general build.gradle.kts dhoondo
            APP_PATH=$(find . -name "build.gradle.kts" | head -n 1)
          fi

          # Real Project Root Director par jao
          PROJECT_ROOT=$(dirname $(dirname "$APP_PATH"))
          echo "Navigating to actual project root: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # Clean up old settings file
          rm -f settings.gradle settings.gradle.kts

          # Create fresh settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NovaPlay"
          if [ -d "app" ]; then
              include(":app")
          fi
          EOF

          # Environment files setup
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=dummy_key" > .env

          # Download Gradle Wrapper
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

          # Build Debug APK
          if [ -d "app" ]; then
            ./gradlew :app:assembleDebug --no-daemon -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36
          else
            ./gradlew assembleDebug --no-daemon -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-vidiopen-debug-apk
          path: '**/*.apk'
          
