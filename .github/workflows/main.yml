name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Files
        run: |
          # Dhoondo ki app/build.gradle.kts kahan hai
          APP_DIR=$(dirname $(find . -name "build.gradle.kts" | grep "app" | head -n 1))
          
          if [ -z "$APP_DIR" ]; then
            PROJECT_ROOT="."
          else
            PROJECT_ROOT=$(dirname "$APP_DIR")
          fi
          
          echo "Project root is: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # agar settings.gradle.kts nahi hai toh ise create kar do
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "NovaPlay"' >> settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

          # Env files setup
          touch local.properties
          echo "GEMINI_API_KEY=dummy_key" > .env

          # Wrapper generator and build
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-vidiopen-debug-apk
          path: '/**/app/build/outputs/apk/debug/*.apk'
          
