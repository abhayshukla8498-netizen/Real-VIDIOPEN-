name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Files
        run: |
          # Check if 'app' directory exists
          if [ -d "app" ]; then
            MODULE_INCLUDE='include(":app")'
          else
            MODULE_INCLUDE=''
          fi

          # Create settings.gradle.kts if missing
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > settings.gradle.kts
            echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> settings.gradle.kts
            echo 'rootProject.name = "NovaPlay"' >> settings.gradle.kts
            if [ -n "$MODULE_INCLUDE" ]; then
              echo "$MODULE_INCLUDE" >> settings.gradle.kts
            fi
          fi

          # Create environment files
          touch local.properties
          echo "GEMINI_API_KEY=dummy_key" > .env

          # Generate Wrapper and make executable
          gradle wrapper
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-vidiopen-debug-apk
          path: '**/*.apk'
          
