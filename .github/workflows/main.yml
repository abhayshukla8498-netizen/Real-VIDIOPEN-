name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Project Structure & Build
        run: |
          # 1. Agar root me build.gradle.kts nahi hai to root plugins build script banao
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle.kts
            plugins {
                alias(libs.plugins.android.application) apply false
                alias(libs.plugins.kotlin.compose) apply false
            }
            EOF
          fi

          # 2. Agar app/ directory nahi hai to banao aur files wahan move karo
          if [ ! -d "app" ]; then
            mkdir -p app
            # Move source files into app folder if present at root
            [ -d "src" ] && mv src app/
            [ -f "build.gradle.kts" ] && [ -f "app/build.gradle.kts" ] || ( [ -f "build.gradle.kts" ] && mv build.gradle.kts app/ )
            [ -f "proguard-rules.pro" ] && mv proguard-rules.pro app/
          fi

          # 3. Clean and recreate settings.gradle.kts with :app module
          rm -f settings.gradle settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NovaPlay"
          include(":app")
          EOF

          # 4. Setup environment properties
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=dummy_key" > .env

          # 5. Generate Wrapper
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

          # 6. Execute Build
          ./gradlew :app:assembleDebug --no-daemon -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-vidiopen-debug-apk
          path: '**/*.apk'
          
