name: Build Play Store Release AAB & APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Extract ZIP & Setup Signing Configuration
        run: |
          # 1. Unzip novaplay.zip
          if [ -f "novaplay.zip" ]; then
            echo "Unzipping novaplay.zip..."
            unzip -o novaplay.zip
          fi

          # 2. Locate Project
          GRADLE_FILE=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          if [ -n "$GRADLE_FILE" ]; then
            TARGET_DIR=$(dirname "$GRADLE_FILE")
            if [ "$(basename "$TARGET_DIR")" = "app" ]; then
              cd "$TARGET_DIR/.."
            else
              cd "$TARGET_DIR"
            fi
          fi

          # 3. Create fresh settings.gradle.kts
          rm -f settings.gradle settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NovaPlay"
          if (file("app").exists()) {
              include(":app")
          }
          EOF

          # 4. Generate Production Keystore with Password 'Abhay2008'
          mkdir -p keystore_backup
          keytool -genkey -v \
            -keystore keystore_backup/release.keystore \
            -alias novaplay_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Abhay2008 \
            -keypass Abhay2008 \
            -dname "CN=Abhay, OU=NovaPlay, O=NovaPlay, L=India, ST=India, C=IN"

          cp keystore_backup/release.keystore release.keystore
          [ -d "app" ] && cp keystore_backup/release.keystore app/release.keystore || true

          # 5. Inject Keystore details into local.properties & gradle.properties
          KEYSTORE_PATH="$(pwd)/release.keystore"
          
          cat << EOF >> local.properties
          sdk.dir=$ANDROID_HOME
          storeFile=$KEYSTORE_PATH
          storePassword=Abhay2008
          keyAlias=novaplay_key
          keyPassword=Abhay2008
          EOF

          cat << EOF >> gradle.properties
          MYAPP_RELEASE_STORE_FILE=$KEYSTORE_PATH
          MYAPP_RELEASE_STORE_PASSWORD=Abhay2008
          MYAPP_RELEASE_KEY_ALIAS=novaplay_key
          MYAPP_RELEASE_KEY_PASSWORD=Abhay2008
          storePassword=Abhay2008
          keyPassword=Abhay2008
          keyAlias=novaplay_key
          storeFile=$KEYSTORE_PATH
          EOF

          echo "GEMINI_API_KEY=dummy_key" > .env

          # 6. Wrapper Setup
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

          # 7. Execute Release Build with explicitly passed signing arguments
          BUILD_FLAGS="-PstorePassword=Abhay2008 -PkeyPassword=Abhay2008 -PkeyAlias=novaplay_key -PstoreFile=$KEYSTORE_PATH -Pandroid.injected.signing.store.file=$KEYSTORE_PATH -Pandroid.injected.signing.store.password=Abhay2008 -Pandroid.injected.signing.key.alias=novaplay_key -Pandroid.injected.signing.key.password=Abhay2008 -Pandroid.overrideVersionCheck=true -Pandroid.suppressUnsupportedCompileSdk=36"

          if [ -d "app" ]; then
            ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon $BUILD_FLAGS
          else
            ./gradlew bundleRelease assembleRelease --no-daemon $BUILD_FLAGS
          fi

      - name: Upload Play Store AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-PlayStore-Release-Bundle
          path: |
            **/*.aab
            **/*.apk

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-Keystore-Backup
          path: keystore_backup/release.keystore
          
