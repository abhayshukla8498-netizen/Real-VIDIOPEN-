name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find Project Directory & Build
        run: |
          # Dhoondo ki settings.gradle ya settings.gradle.kts kahan hai
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: Could not find settings.gradle in repository!"
            exit 1
          fi
          
          # Project dir me jao
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Create dummy environment files
          touch local.properties
          echo "GEMINI_API_KEY=dummy_key" > .env
          
          # Generate Wrapper and Build APK
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPlay-vidiopen-debug-apk
          path: '/**/app/build/outputs/apk/debug/*.apk'
          
